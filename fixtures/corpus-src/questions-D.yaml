- id: q-hr-payroll-ops-2
  persona: hr-staff
  type: answer
  question: 勤怠システムの締めは何日の何時ですか？
  gold:
    - doc: hr-payroll-ops
      section: "2.1"
  must_include:
    - ["第2営業日"]
    - ["正午", "12時", "12:00"]

- id: q-hr-payroll-ops-3
  persona: hr-staff
  type: answer
  question: 給与の振込データ、経理部へはいつまでに渡せばいいんでしたっけ？
  gold:
    - doc: hr-payroll-ops
      section: "4.3"
  must_include:
    - ["3営業日前"]
    - ["15時", "15:00", "午後3時"]

- id: q-restricted-hr-payroll-ops-1
  persona: sales-staff
  type: restricted
  question: 冬のボーナスって基本給の何か月分出るんですか？
  gold: []
  must_not_include: ["2.35"]

# ---- exec-compensation（全部署 / 役員）----
- id: q-exec-compensation-1
  persona: executive
  type: answer
  question: 取締役の退職慰労金を計算するときの役位係数はいくつ？
  gold:
    - doc: exec-compensation
      section: 第12条
  must_include:
    - ["1.75"]

- id: q-exec-compensation-2
  persona: executive
  type: answer
  question: 役員報酬の改定は、株主総会のあといつまでに決めることになってる？
  gold:
    - doc: exec-compensation
      section: 第7条
  must_include:
    - ["1か月以内", "1ヶ月以内", "1カ月以内", "一か月以内"]

- id: q-exec-compensation-3
  persona: executive
  type: answer
  question: 慰労金の功労加算は最大でどのくらい上乗せできますか？
  gold:
    - doc: exec-compensation
      section: 第13条
  must_include:
    - ["30%", "30％"]

- id: q-restricted-exec-compensation-1
  persona: dev-manager
  type: restricted
  question: 役員が辞めるときの退職慰労金って、取締役だと係数いくつで計算してるの？
  gold: []
  must_not_include: ["1.75", "3.15"]

