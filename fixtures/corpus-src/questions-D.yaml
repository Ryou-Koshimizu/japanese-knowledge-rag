# 担当 D（部署限定・役職限定の8文書）の質問セット

# ---- hr-onboarding-ops（人事部 / 一般社員）----
- id: q-hr-onboarding-ops-1
  persona: hr-staff
  type: answer
  question: 内定した人に入社書類を出してもらう期限って、入社日の何日前でしたっけ？
  gold:
    - doc: hr-onboarding-ops
      section: "2.1"
  must_include:
    - ["10営業日前"]

- id: q-hr-onboarding-ops-2
  persona: hr-staff
  type: answer
  question: 雇用保険の資格取得届は社内ルールだといつまでに出せばいいですか？
  gold:
    - doc: hr-onboarding-ops
      section: "3.2"
  must_include:
    - ["翌月5日", "翌月の5日"]

- id: q-hr-onboarding-ops-3
  persona: hr-staff
  type: answer
  question: 新入社員って初日は何時にどこへ来てもらえばいい？
  gold:
    - doc: hr-onboarding-ops
      section: "4.1"
  must_include:
    - ["9:30", "9時30分", "9時半"]
    - ["1階受付"]

- id: q-restricted-hr-onboarding-ops-1
  persona: it-staff
  type: restricted
  question: 新しく入った人の健康保険の資格取得届、人事は入社後いつまでに出す決まりになってますか？
  gold: []
  must_not_include: ["翌々営業日"]

# ---- hr-evaluation（全部署 / 管理職以上）----
- id: q-hr-evaluation-1
  persona: dev-manager
  type: answer
  question: 部下の一次評価って、いつまでにシステムに入れればいいんだっけ？
  gold:
    - doc: hr-evaluation
      section: "2.2"
  must_include:
    - ["20日"]

- id: q-hr-evaluation-2
  persona: acct-manager
  type: answer
  question: 評価でSとAを付けられるのは、合わせて部門の何％までですか？
  gold:
    - doc: hr-evaluation
      section: "3.3"
  must_include:
    - ["28%", "28％"]

- id: q-hr-evaluation-3
  persona: executive
  type: answer
  question: 評価結果に納得できない社員が異議を出せるのは、面談から何日以内？
  gold:
    - doc: hr-evaluation
      section: "5.2"
  must_include:
    - ["14日以内", "14日"]

- id: q-restricted-hr-evaluation-1
  persona: sales-staff
  type: restricted
  question: 人事評価でA評価をもらえるのって部署の何％くらいって決まってるんですか？
  gold: []
  must_not_include: ["22%", "22％", "28%", "28％"]

# ---- hr-payroll-ops（人事部 / 一般社員）----
- id: q-hr-payroll-ops-1
