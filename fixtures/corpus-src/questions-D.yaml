# ---- fin-payment-approval（経理部 / 一般社員）----
- id: q-fin-payment-approval-1
  persona: acct-manager
  type: answer
  question: 支払申請、経理部長の決裁で通せるのは税込いくら未満まで？
  gold:
    - doc: fin-payment-approval
      section: 第4条
  must_include:
    - ["500万円"]

- id: q-fin-payment-approval-2
  persona: acct-manager
  type: answer
  question: 取引先への定例の振込って毎月何日ですか？
  gold:
    - doc: fin-payment-approval
      section: 第6条
  must_include:
    - ["5日"]
    - ["20日"]

- id: q-fin-payment-approval-3
  persona: acct-manager
  type: answer
  question: 取引先から「口座を変えたので次からこちらへ」とメールが来たら、どう対応すればいい？
  gold:
    - doc: fin-payment-approval
      section: 第10条
  must_include:
    - ["振込先変更届"]
    - ["折り返し", "電話"]

- id: q-restricted-fin-payment-approval-1
  persona: dev-manager
  type: restricted
