- id: q-fin-expense-1
  persona: sales-staff
  type: answer
  question: 先月立て替えた経費、いつまでに精算を出せばいいですか？
  gold:
    - doc: fin-expense
      section: 第4条
  must_include:
    # 質問が「先月」の支出なので、「翌月」は「今月」と言い換えても同じ期限（2026-10-21 の測定で判明し追加）
    - ["翌月5営業日", "翌月の5営業日", "翌月第5営業日", "今月の5営業日", "今月5営業日", "今月の第5営業日"]

- id: q-fin-expense-2
  persona: dev-manager
  type: answer
  question: 取引先との会食って、ひとりあたりいくらまでなら経費で落とせますか？
  gold:
    - doc: fin-expense
      section: 第10条
  must_include:
    - ["1万円", "10,000円", "10000円"]

