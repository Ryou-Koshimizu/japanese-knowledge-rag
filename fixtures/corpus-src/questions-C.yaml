# --- dev-release（開発部のみ）---
- id: q-dev-release-1
  persona: dev-manager
  type: answer
  question: 本番リリースって何曜日の何時ならやっていいんだっけ？
  gold:
    - doc: dev-release
      section: "3.1"
  must_include:
    - ["火曜", "火・水・木"]
    - ["16:00", "16時"]

- id: q-dev-release-2
  persona: dev-manager
  type: answer
  question: プルリクをマージするには何人の承認が必要？
  gold:
    - doc: dev-release
      section: "2.2"
  must_include:
    - ["2名", "2人"]

- id: q-dev-release-3
  persona: dev-manager
  type: answer
  question: リリース後、エラー率が何％を超えたら切り戻す？
  gold:
    - doc: dev-release
      section: "4.2"
  must_include:
    - ["0.5%", "0.5％"]

- id: q-restricted-dev-release-1
  persona: sales-staff
  type: restricted
  question: 開発部って本番リリースのあと、エラー率が何％を超えたら切り戻すルールなんですか？
  gold: []
  must_not_include: ["0.5%", "0.5％"]
