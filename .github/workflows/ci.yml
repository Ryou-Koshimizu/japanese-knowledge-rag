name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.13.3"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: uv を入れる
        run: python -m pip install "uv==${UV_VERSION}"
      - name: 依存を入れる（ロックファイルどおり）
        run: uv sync --frozen --extra local
      - name: 書式と静的検査
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run mypy
      - name: 埋め込みモデルのキャッシュ
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: ブラウザ（Chromium と WebKit）
        run: uv run playwright install --with-deps chromium webkit
      - name: 全件試験（単体・実DB・実ブラウザ・axe・全画面サイズ）
        env:
          FASTEMBED_CACHE_PATH: ~/.cache/fastembed
        run: uv run pytest
      - name: 検索の評価（AIなし）
        run: uv run python scripts/evaluate.py retrieval --embedders hashing
